name: Kumowatch
options:
  bundleIdPrefix: com.kravtsov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Daily:
    url: https://github.com/daily-co/daily-client-ios
    from: 0.41.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.8"
    CURRENT_PROJECT_VERSION: "1"
    KUMO_BUNDLE_ID: com.kravtsov.kumowatch
    KUMO_CAPS: ""
targets:
  Kumowatch:
    type: application
    platform: iOS
    sources:
      - Kumowatch
      - Shared
      - KumoCore/Sources
    dependencies:
      - framework: KumoCore/KumoFFI.xcframework
        embed: false
      - package: Daily
      - target: KumowatchWidget
        embed: true
    info:
      path: Kumowatch/Info.plist
      properties:
        KumoKeychainGroup: $(AppIdentifierPrefix)$(KUMO_BUNDLE_ID).shared
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Talk with people in your Kumospace room.
        NSCameraUsageDescription: Show your video to people in your Kumospace room and scan relay QR codes.
        NSPhotoLibraryUsageDescription: Send photos to your Kumospace chats.
        UIBackgroundModes: [audio, voip]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: kumospace
            CFBundleURLSchemes: [kumospace]
          - CFBundleURLName: kumowatch
            CFBundleURLSchemes: [kumowatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KUMO_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Kumowatch/Kumowatch$(KUMO_CAPS).entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Better Kumo"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  KumowatchWidget:
    type: app-extension
    platform: iOS
    sources:
      - KumowatchWidget
      - Shared
    info:
      path: KumowatchWidget/Info.plist
      properties:
        CFBundleDisplayName: "Better Kumo"
        KumoKeychainGroup: $(AppIdentifierPrefix)$(KUMO_BUNDLE_ID).shared
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KUMO_BUNDLE_ID).widget
        CODE_SIGN_ENTITLEMENTS: KumowatchWidget/KumowatchWidget$(KUMO_CAPS).entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Better Kumo"
        MARKETING_VERSION: "0.2.8"
        CURRENT_PROJECT_VERSION: "1"
