name: Kumowatch
options:
  bundleIdPrefix: com.kravtsov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Daily:
    url: https://github.com/daily-co/daily-client-ios
    from: 0.41.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kumowatch:
    type: application
    platform: iOS
    sources:
      - Kumowatch
      - KumoCore/Sources
    dependencies:
      - framework: KumoCore/KumoFFI.xcframework
        embed: false
      - package: Daily
      - target: KumowatchWidget
        embed: true
    info:
      path: Kumowatch/Info.plist
      properties:
        NSMicrophoneUsageDescription: Talk with people in your Kumospace room.
        NSCameraUsageDescription: Show your video to people in your Kumospace room.
        NSPhotoLibraryUsageDescription: Send photos to your Kumospace chats.
        UIBackgroundModes: [audio, voip]
        CFBundleURLTypes:
          - CFBundleURLName: kumospace
            CFBundleURLSchemes: [kumospace]
          - CFBundleURLName: kumowatch
            CFBundleURLSchemes: [kumowatch]
    entitlements:
      path: Kumowatch/Kumowatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kravtsov.kumowatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kumowatch
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  KumowatchWidget:
    type: app-extension
    platform: iOS
    sources:
      - KumowatchWidget
    entitlements:
      path: KumowatchWidget/KumowatchWidget.entitlements
    info:
      path: KumowatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Kumowatch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kravtsov.kumowatch.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kumowatch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
