[package]
name = "kumo-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
kumo-core.workspace = true
kumo-devtools.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls"] }
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "io-std"] }
