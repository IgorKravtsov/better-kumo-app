[package]
name = "kumo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query", "multipart"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url.workspace = true
webpki-root-certs = "1.0.12"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "test-util"] }
