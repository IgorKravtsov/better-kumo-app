[package]
name = "kumo-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "kumo_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
kumo-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uniffi.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "io-util"] }
