[workspace]
resolver = "3"
members = ["crates/kumo-cli", "crates/kumo-core", "crates/kumo-desktop", "crates/kumo-devtools", "crates/kumo-ffi", "crates/kumo-mcp", "crates/kumo-meetings", "crates/kumo-relay", "crates/kumo-transcriber"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
kumo-core = { path = "crates/kumo-core" }
kumo-devtools = { path = "crates/kumo-devtools" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = "0.32.2"
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
