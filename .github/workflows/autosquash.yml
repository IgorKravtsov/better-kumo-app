# A pull request with the label "autosquash" is squash-merged into one commit as soon as all its checks pass.
# Release pull requests use it: their title starts with "[Release]", which the squash commit turns into "Release".
name: Autosquash

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  # CI finished on a pull request.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Another App's check (the code review) finished after CI.
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autosquash-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}

jobs:
  merge:
    runs-on: ubuntu-24.04
    if: >
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'autosquash')) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    steps:
      - name: Merge when every check passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
        run: |
          pr="$(gh pr list --state open --label autosquash --json number,headRefOid,isDraft \
            --jq ".[] | select(.headRefOid == \"$SHA\" and (.isDraft | not)) | .number" | head -1)"
          [ -n "$pr" ] || { echo "No open pull request with the label autosquash at $SHA."; exit 0; }
          # CI must have run on this exact commit: right after the label the other checks may not exist yet.
          ci="$(gh run list --workflow ci.yml --event pull_request --commit "$SHA" --limit 1 --json status,conclusion \
            --jq '.[0] | "\(.status) \(.conclusion)"')"
          [ "$ci" = "completed success" ] || { echo "CI at $SHA: ${ci:-not started}; waiting."; exit 0; }
          # Every other check too (the code review, when it runs), except this workflow's own job.
          checks="$(gh pr checks "$pr" --json name,bucket --jq '.[] | select(.name != "merge") | "\(.bucket) \(.name)"' || true)"
          echo "$checks"
          if grep -qE '^pending ' <<< "$checks"; then echo "Checks still running; waiting."; exit 0; fi
          if grep -qvE '^(pass|skipping) ' <<< "$checks"; then echo "A check did not pass; not merging."; exit 1; fi
          title="$(gh pr view "$pr" --json title --jq .title)"
          subject="$(sed -E 's/^\[Release\][[:space:]]*/Release /' <<< "$title") (#$pr)"
          gh pr merge "$pr" --squash --subject "$subject" --match-head-commit "$SHA" --delete-branch
          echo "Merged #$pr as \"$subject\"."
