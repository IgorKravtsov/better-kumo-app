name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
        working-directory: core
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: core
      - run: cargo test --workspace
        working-directory: core

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Inno Setup
        shell: bash
        run: |
          # Ukrainian.isl ships with Inno Setup 6.5+.
          [ -f "/c/Program Files (x86)/Inno Setup 6/Languages/Ukrainian.isl" ] || choco upgrade innosetup -y --no-progress
      - run: scripts/build-desktop-windows.sh
        shell: bash
      - name: Install, start and uninstall
        shell: pwsh
        run: packaging/windows/smoke-test.ps1 -Setup (Get-Item dist/Better-Kumo-Windows-x64-*-Setup.exe).FullName

  watcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci && npm run check
        working-directory: apps/watcher

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: cargo install cargo-ndk --locked
      # armeabi-v7a: the Wear OS release ships it for 32-bit watches.
      - run: PROFILE=debug ABIS="arm64-v8a armeabi-v7a x86_64" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-core-android.sh
      - run: ./gradlew :app:assembleDebug :wear:assembleDebug
        working-directory: apps/android
      - run: unzip -l apps/android/wear/build/outputs/apk/debug/wear-debug.apk | grep -q 'lib/armeabi-v7a/libkumo_ffi.so'

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: brew install xcodegen
      - run: PROFILE=debug scripts/build-core-ios.sh
      - run: xcodegen generate
        working-directory: apps/ios
      - run: >
          xcodebuild -project Kumowatch.xcodeproj -scheme Kumowatch
          -destination 'generic/platform=iOS Simulator' -configuration Debug
          CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/ios
      - name: Package the SideStore .ipa as the release does
        run: |
          SKIP_CORE=1 KUMO_VERSION=0.0.1 scripts/build-ios-ipa.sh "$RUNNER_TEMP/ipa"
          IPA="$RUNNER_TEMP/ipa/Better-Kumo-iOS-0.0.1.ipa"
          test -s "$IPA"
          # The widget ships; the watch app must not (SideStore can't install it).
          LIST="$(unzip -l "$IPA")"
          grep -q 'Payload/Kumowatch.app/PlugIns/KumowatchWidget.appex/' <<<"$LIST"
          if grep -Eq 'Payload/Kumowatch.app/(Watch/|.*KumowatchWatch)' <<<"$LIST"; then echo "::error::The .ipa contains the watch app"; exit 1; fi
