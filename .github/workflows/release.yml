name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for the file names (builds only; publishing needs a v* tag)
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Better Kumo for macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build
        run: |
          export KUMO_VERSION="${VERSION#v}" KUMO_UNIVERSAL=1
          scripts/build-desktop-macos.sh
          mv dist/Better-Kumo-macOS-*.zip "dist/Better-Kumo-macOS-${KUMO_VERSION}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/Better-Kumo-macOS-*.zip

  windows:
    name: Better Kumo for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Inno Setup
        shell: bash
        run: |
          # Ukrainian.isl ships with Inno Setup 6.5+.
          [ -f "/c/Program Files (x86)/Inno Setup 6/Languages/Ukrainian.isl" ] || choco upgrade innosetup -y --no-progress
      - name: Build
        shell: bash
        run: KUMO_VERSION="${VERSION#v}" scripts/build-desktop-windows.sh
      - name: Install, start and uninstall
        shell: pwsh
        run: packaging/windows/smoke-test.ps1 -Setup (Get-Item dist/Better-Kumo-Windows-x64-*-Setup.exe).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/Better-Kumo-Windows-*-Setup.exe
            dist/Better-Kumo-Windows-*.zip

  linux:
    name: Better Kumo for Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build
        run: |
          v="${VERSION#v}"
          cargo build --manifest-path core/Cargo.toml -p kumo-desktop -p kumo-mcp --release
          mkdir -p "dist/better-kumo-${v}"
          cp core/target/release/better-kumo "dist/better-kumo-${v}/better-kumo"
          cp core/target/release/kumo-mcp "dist/better-kumo-${v}/kumo-mcp"
          tar -C dist -czf "dist/Better-Kumo-Linux-x64-${v}.tar.gz" "better-kumo-${v}"
      - name: Debian package
        run: |
          v="${VERSION#v}"
          root="dist/deb/better-kumo_${v}_amd64"
          install -Dm755 core/target/release/better-kumo "$root/usr/bin/better-kumo"
          install -Dm755 core/target/release/kumo-mcp "$root/usr/bin/kumo-mcp"
          install -Dm644 packaging/linux/better-kumo.desktop "$root/usr/share/applications/better-kumo.desktop"
          install -Dm644 packaging/linux/better-kumo.png "$root/usr/share/icons/hicolor/256x256/apps/better-kumo.png"
          install -Dm644 LICENSE "$root/usr/share/doc/better-kumo/copyright"
          mkdir -p "$root/DEBIAN"
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: better-kumo
          Version: ${v}
          Architecture: amd64
          Maintainer: Igor Kravtsov <86327720+IgorKravtsov@users.noreply.github.com>
          Depends: libgtk-3-0, libayatana-appindicator3-1, libxdo3
          Section: net
          Priority: optional
          Homepage: https://github.com/IgorKravtsov/better-kumo-app
          Description: Control your Kumospace desktop from your phone
           Better Kumo is a tray app that starts Kumospace desktop with phone control,
           runs the relay the Better Kumo phone app pairs with, and sends notifications.
          CONTROL
          sed -i 's/^          //' "$root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$root" "dist/better-kumo_${v}_amd64.deb"
          dpkg-deb --info "dist/better-kumo_${v}_amd64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/Better-Kumo-Linux-*.tar.gz
            dist/better-kumo_*.deb

  transcriber:
    name: Meetings module (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-latest, ext: "" }
          - { platform: macos-x64, runner: macos-15-intel, ext: "" }
          - { platform: windows-x64, runner: windows-latest, ext: ".exe" }
          - { platform: linux-x64, runner: ubuntu-22.04, ext: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: transcriber
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)"
          [ "$crate" = "${VERSION#v}" ] || { echo "core/Cargo.toml says $crate, the tag says ${VERSION#v}: Better Kumo would download the wrong meetings module"; exit 1; }
      - name: Build
        shell: bash
        run: |
          v="${VERSION#v}"
          cargo build --manifest-path core/Cargo.toml -p kumo-transcriber --release
          name="better-kumo-transcriber-${{ matrix.platform }}-${v}${{ matrix.ext }}"
          mkdir -p dist
          cp "core/target/release/better-kumo-transcriber${{ matrix.ext }}" "dist/$name"
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - "dist/$name"; fi
          "dist/$name" --version
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          cat "$name.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: transcriber-${{ matrix.platform }}
          path: dist/better-kumo-transcriber-*

  android:
    name: Better Kumo for Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0 ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          conf="$HOME/.config/kumowatch"
          mkdir -p "$conf"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$conf/android-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=kumowatch\nkeyPassword=%s\n' \
            "$conf/android-release.jks" "$KEY_PASSWORD" "$KEY_PASSWORD" > "$conf/android-signing.properties"
          chmod 600 "$conf"/*
      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.1.12297006" KUMO_VERSION="${VERSION#v}"
          scripts/build-android-release.sh
          mv dist/kumowatch-latest.apk "dist/Better-Kumo-Android-${KUMO_VERSION}.apk"
      - name: Remove signing key
        if: always()
        run: rm -rf "$HOME/.config/kumowatch"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/Better-Kumo-Android-*.apk

  ios:
    name: Better Kumo for iPhone (SideStore)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: brew install xcodegen
      - name: Build
        run: |
          ipa="$(scripts/build-ios-ipa.sh dist | tail -1)"
          mv "$ipa" "dist/Better-Kumo-iOS-${VERSION#v}.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/Better-Kumo-iOS-*.ipa

  release:
    name: GitHub Release
    needs: [macos, windows, linux, transcriber, android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Sign for in-app updates
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "MINISIGN_SECRET_KEY is not set: Better Kumo could not update itself to this release"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign > /dev/null
          v="${VERSION#v}"
          # Install files go on the release page; everything the apps download by themselves goes to service/.
          mkdir -p install service
          mv dist/better-kumo-transcriber-* service/
          mv dist/* install/
          key="$(mktemp)"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          # Only the files the in-app updater installs (updater.rs, Install::asset).
          for name in "Better-Kumo-macOS-${v}.zip" "Better-Kumo-Windows-x64-${v}.zip" "Better-Kumo-Linux-x64-${v}.tar.gz" "better-kumo_${v}_amd64.deb"; do
            minisign -S -s "$key" -m "install/$name" -x "service/$name.minisig" > /dev/null
            minisign -V -q -p packaging/release-minisign.pub -m "install/$name" -x "service/$name.minisig"
            # Better Kumo also requires the signed file name, which minisign writes into the trusted comment.
            grep -qF "$(printf '\tfile:%s\t' "$name")" "service/$name.minisig" || { echo "$name.minisig does not name $name"; exit 1; }
          done
          rm -f "$key"
          ls install service
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION#v}"
          # One prerelease holds the service files of every version, so it never becomes "latest".
          # They go up first: the apps look for them as soon as the release below appears.
          gh release view release-files --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || gh release create release-files --repo "${{ github.repository }}" --prerelease --latest=false \
              --title "Service files (not for download)" \
              --notes "Files Better Kumo downloads by itself: the meetings module for every version and the signatures of in-app updates. To install Better Kumo, open the [latest release](https://github.com/${{ github.repository }}/releases/latest)."
          gh release upload release-files service/* --repo "${{ github.repository }}" --clobber
          notes="Downloads for Better Kumo ${tag#v}.

          - **macOS** (Apple Silicon and Intel, macOS 13+): \`Better-Kumo-macOS-${tag#v}.zip\`. Unzip, move to Applications, then right-click → Open the first time (the app is not notarized).
          - **Windows** (10/11, x64): \`Better-Kumo-Windows-x64-${tag#v}-Setup.exe\`. Run it; no administrator rights needed, it updates an earlier install in place. SmartScreen may ask: More info → Run anyway. Portable alternative: \`Better-Kumo-Windows-x64-${tag#v}.zip\`, unzip to a folder that stays and run \`Better Kumo.exe\`.
          - **Linux** (x64, GTK desktop with a tray): \`sudo apt install better-kumo\` from the APT repository (see the install guide), or \`better-kumo_${tag#v}_amd64.deb\`, or \`Better-Kumo-Linux-x64-${tag#v}.tar.gz\` (needs \`libgtk-3-0\`, \`libayatana-appindicator3-1\`, \`libxdo3\`).
          - **Homebrew** (macOS): \`brew tap igorkravtsov/tap && brew trust igorkravtsov/tap && brew install --cask better-kumo\`.
          - **Android** (8.0+, arm64): \`Better-Kumo-Android-${tag#v}.apk\`. Open it on the phone and allow installing from this source.
          - **iPhone** (iOS 17+): \`Better-Kumo-iOS-${tag#v}.ipa\` through SideStore with a free Apple ID; add the source https://igorkravtsov.github.io/better-kumo-app/sidestore/apps.json in SideStore → Sources to get updates there. Or build it yourself with \`scripts/build-ios-device.sh\` (see docs/install.md).
          - **Updating**: if your Better Kumo menu has **Update to … and restart**, use it; Better Kumo checks the update's signature before installing it.
          - **Meetings module**: optional, Better Kumo downloads it from Settings → Meetings.

          Setup guide: https://github.com/${{ github.repository }}/blob/main/docs/install.md"
          gh release create "$tag" install/* --repo "${{ github.repository }}" --title "Better Kumo ${tag#v}" --notes "$notes" \
            || gh release upload "$tag" install/* --repo "${{ github.repository }}" --clobber

  apt:
    name: APT repository
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get install -y -qq apt-utils gnupg > /dev/null
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          repo="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git clone --quiet --branch gh-pages --depth 1 "$repo" site || { mkdir site && git -C site init -q -b gh-pages; }
          mkdir -p site/apt/pool/main/b/better-kumo site/apt/dists/stable/main/binary-amd64
          cp dist/better-kumo_*.deb site/apt/pool/main/b/better-kumo/
          touch site/.nojekyll
          cd site/apt
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -9kf dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Better Kumo" -o APT::FTPArchive::Release::Label="Better Kumo" \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 -o APT::FTPArchive::Release::Components=main \
            release dists/stable > /tmp/Release
          mv /tmp/Release dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --armor --export > better-kumo.asc
          gpg --export > better-kumo.gpg
          cd ..
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "APT repository: ${VERSION}"
          git push -q "$repo" gh-pages

  sidestore:
    name: SideStore source
    # After apt: both jobs push to gh-pages.
    needs: [release, apt]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ios
          path: dist
      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${VERSION#v}"
          ipa="dist/Better-Kumo-iOS-${v}.ipa"
          repo="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git clone --quiet --branch gh-pages --depth 1 "$repo" site
          mkdir -p site/sidestore
          cp apps/ios/Kumowatch/Assets.xcassets/AppIcon.appiconset/icon-1024.png site/sidestore/icon.png
          base="https://igorkravtsov.github.io/better-kumo-app/sidestore"
          jq -n --arg v "$v" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson size "$(stat -c %s "$ipa")" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/v${v}/Better-Kumo-iOS-${v}.ipa" \
            --arg base "$base" --arg notes "https://github.com/${{ github.repository }}/releases/tag/v${v}" '{
              name: "Better Kumo", identifier: "com.kravtsov.kumowatch.source", sourceURL: "\($base)/apps.json",
              iconURL: "\($base)/icon.png",
              apps: [{
                name: "Better Kumo", bundleIdentifier: "com.kravtsov.kumowatch", developerName: "Better Kumo",
                subtitle: "Kumospace on your iPhone", iconURL: "\($base)/icon.png", tintColor: "#6B4EFF",
                localizedDescription: "Chat, office and calls of Kumospace. Release notes: \($notes)",
                versions: [{ version: $v, date: $date, size: $size, downloadURL: $url, minOSVersion: "17.0",
                             localizedDescription: "Release notes: \($notes)" }],
                appPermissions: { entitlements: ["keychain-access-groups"],
                  privacy: { NSMicrophoneUsageDescription: "Talk with people in your Kumospace room.",
                             NSCameraUsageDescription: "Show your video and scan relay QR codes.",
                             NSPhotoLibraryUsageDescription: "Send photos to your Kumospace chats." } }
              }],
              news: []
            }' > site/sidestore/apps.json
          cd site
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "SideStore source: ${VERSION}"
          git push -q "$repo" gh-pages

  apt-check:
    name: Install from the APT repository
    needs: apt
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install as the docs describe
        run: |
          v="${VERSION#v}"
          apt-get update -qq && apt-get install -y -qq curl ca-certificates gpg > /dev/null
          base="https://igorkravtsov.github.io/better-kumo-app/apt"
          for i in $(seq 1 40); do
            curl -fsSL "$base/dists/stable/main/binary-amd64/Packages" | grep -q "^Version: ${v}$" && break
            sleep 15
          done
          curl -fsSL "$base/better-kumo.gpg" -o /usr/share/keyrings/better-kumo.gpg
          echo "deb [signed-by=/usr/share/keyrings/better-kumo.gpg] $base stable main" > /etc/apt/sources.list.d/better-kumo.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq better-kumo > /dev/null
          dpkg -s better-kumo | grep -E "^(Status|Version)"
          test -x /usr/bin/better-kumo

  homebrew:
    name: Homebrew cask
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist
      - name: Update the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          v="${VERSION#v}"
          sha="$(sha256sum "dist/Better-Kumo-macOS-${v}.zip" | cut -d' ' -f1)"
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o StrictHostKeyChecking=accept-new"
          git clone --quiet git@github.com:IgorKravtsov/homebrew-tap.git tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${v}/" -e "s/@SHA256@/${sha}/" packaging/homebrew/better-kumo.rb > tap/Casks/better-kumo.rb
          cd tap
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "better-kumo ${v}" || exit 0
          git push -q origin HEAD
      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/tap
